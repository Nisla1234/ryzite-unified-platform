name: RYZITE SEO and Build Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "automation/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ryzite-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check-seo:
    name: Build and verify SEO routes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro application
        run: pnpm run build

      - name: Verify canonical domain and SEO route source files
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';

          const config = readFileSync('astro.config.mjs', 'utf8');
          const sitemap = readFileSync('src/pages/sitemap.xml.ts', 'utf8');
          const robots = readFileSync('src/pages/robots.txt.ts', 'utf8');

          const checks = [
            ['Canonical Astro site URL', /site:\s*["']https:\/\/www\.ryzite\.lk["']/.test(config)],
            ['Sitemap route exists', existsSync('src/pages/sitemap.xml.ts')],
            ['Robots route exists', existsSync('src/pages/robots.txt.ts')],
            ['Sitemap uses the canonical host', sitemap.includes('https://www.ryzite.lk')],
            ['Robots sitemap directive uses the canonical host', robots.includes('https://www.ryzite.lk/sitemap.xml')],
          ];

          let failed = false;
          for (const [label, passed] of checks) {
            console.log(`${passed ? 'PASS' : 'FAIL'}: ${label}`);
            if (!passed) failed = true;
          }
          if (failed) process.exit(1);
          NODE
